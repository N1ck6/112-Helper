# Полный стенд тренажёра ДДС-112: Frontend + Backend + PostgreSQL + ML + телефония — одной командой:
#
#   docker compose --profile llm up -d --build     # с локальной LLM (Ollama + qwen3:4b, ~2.6 ГБ)
#   docker compose up -d --build                   # без LLM: ML работает на классификаторе и правилах
#
# http://localhost:8080 — АРМ (с другого ПК: http://<IP>:8080). Через этот же адрес (nginx)
# браузер ходит в Backend (/api/), телефонию (/telephony/, /recordings/) и ML (/ml/dialogue/).
#
# Кто с кем связан (контракты — ТЗ_итоговое §6):
#   frontend ─/api/v1─> api (backend) ──> postgres
#       │                  │  ├─ /api/v1/generate|evaluate ──> ml   (при 501 или сбое — правила backend)
#       │                  │  └─ /api/v1/calls/originate ────> virtual-caller
#       └─/telephony/────> virtual-caller ─/dialogue/turn─> ml ─(profile llm)─> ollama
#                              └─ события звонка ─> api /api/v1/telephony/events (X-Telephony-Token)
#
# Каждая роль держит свой Dockerfile в своей папке; телефония подключается через include
# (её compose автономен, deploy/telephony.integration.yml переключает её с заглушек на ML/Backend).
# Настройки — .env рядом с этим файлом (шаблон .env.example) и telephony/.env. Оба необязательны,
# но пароли и SECRET_KEY для эксплуатации нужно задать.
# Не запускать одновременно с `docker compose up` из telephony/ (те же имена контейнеров).

include:
  - path:
      - telephony/docker-compose.yml
      - deploy/telephony.integration.yml

services:
  # ------------------------------------------------------------------ Frontend
  # Статика из frontend/ + единая точка входа для браузера (deploy/nginx/default.conf).
  frontend:
    image: nginx:1.27-alpine
    container_name: trainer-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - ml
      - virtual-caller
      - audio-tools
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ------------------------------------------------------------------- Backend
  postgres:
    image: postgres:16-alpine
    container_name: trainer-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dds112}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dds112}
      POSTGRES_DB: ${POSTGRES_DB:-dds112}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dds112} -d ${POSTGRES_DB:-dds112}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    container_name: trainer-api
    env_file:
      - path: backend/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-dds112}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dds112}
      POSTGRES_DB: ${POSTGRES_DB:-dds112}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-0123456789abcdef}
      # ML-сервис команды; чего он не умеет (501) или не смог — считают правила backend
      ML_SERVICE_URL: http://ml:8000
      ML_USE_STUB: "false"
      ML_FALLBACK_TO_RULES: "true"
      ML_TIMEOUT_SECONDS: ${ML_TIMEOUT_SECONDS:-60}
      # Телефония: backend поднимает звонки, телефония присылает события на вебхук
      TELEPHONY_SERVICE_URL: http://virtual-caller:8092
      TELEPHONY_USE_STUB: "false"
      TELEPHONY_WEBHOOK_TOKEN: ${TELEPHONY_WEBHOOK_TOKEN:-dev-telephony-token}
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-8080}"]'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"   # /docs — документация API
    volumes:
      - backend-var:/srv/app/var
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    restart: unless-stopped

  # ------------------------------------------------------------------------ ML
  ml:
    build: ./ml
    container_name: trainer-ml
    environment:
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
      # Реплики собеседников в звонках: rules (быстро, предсказуемо) | llm (через Ollama, при сбое — rules).
      # Для llm нужна instruct-модель без рассуждений: qwen3:4b «думает» вслух и отвечает 10+ с.
      DIALOGUE_ENGINE: ${DIALOGUE_ENGINE:-rules}
      DIALOGUE_LLM_MODEL: ${DIALOGUE_LLM_MODEL:-qwen3:4b-instruct}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-20}
    depends_on:
      ollama:
        condition: service_healthy
        required: false   # без профиля llm ML работает без LLM
    ports:
      - "${ML_PORT:-8100}:8000"   # /docs — документация ML API
    restart: unless-stopped

  # Локальная LLM (профиль llm): модель скачивается один раз в том ollama-models.
  ollama:
    image: ollama/ollama:latest
    container_name: trainer-ollama
    profiles: [llm]
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: trainer-ollama-init
    profiles: [llm]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${LLM_MODEL:-qwen3:4b}"]
    restart: "no"

volumes:
  pgdata:
  backend-var:
  ollama-models:
