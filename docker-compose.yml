# Полный стенд тренажёра ДДС-112: Frontend + Backend + PostgreSQL + ML + локальная LLM + телефония.
#
# Установка и запуск — одним файлом из корня: start.bat (Windows) или ./start.sh (Linux/macOS).
# Он создаёт .env со случайными паролями, поднимает стенд и открывает АРМ в браузере. Вручную:
#   cp .env.example .env   (и задать пароли)   →   docker compose up -d --build
# LLM (Ollama + qwen3:4b-instruct, ~2.5 ГБ) включена в .env: COMPOSE_PROFILES=llm; пусто — без LLM.
#
# http://localhost:8080 — АРМ (с другого ПК: http://<IP>:8080). Через этот же адрес (nginx)
# браузер ходит в Backend (/api/), телефонию (/telephony/, /recordings/) и ML (/ml/).
#
# Кто с кем связан (контракты — ТЗ_итоговое §6):
#   frontend ─/api/v1─> api (backend) ──> postgres
#       │                  │  ├─ /api/v1/generate|evaluate ──> ml   (при 501 или сбое — правила backend)
#       │                  │  └─ /api/v1/calls/originate ────> virtual-caller
#       └─/telephony/────> virtual-caller ─/dialogue/turn─> ml ─(profile llm)─> ollama
#                              └─ события звонка ─> api /api/v1/telephony/events (X-Telephony-Token)
#
# Каждая роль держит свой Dockerfile в своей папке; сервисы телефонии — в telephony/docker-compose.yml
# (подключается через include).
# Все настройки — один .env рядом с этим файлом (шаблон .env.example); пароли и ключи обязательны.
# Не запускать одновременно с `docker compose up` из telephony/ (те же имена контейнеров).

include:
  - path: telephony/docker-compose.yml
    # общий .env стенда: телефония читает настройки и пароли оттуда же, что и остальные сервисы
    env_file: .env
    env_file: .env

services:
  # ------------------------------------------------------------------ Frontend
  # Статика из frontend/ + единая точка входа для браузера (deploy/nginx/default.conf).
  frontend:
    image: nginx:1.27-alpine
    container_name: trainer-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - ml
      - virtual-caller
      - audio-tools
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ------------------------------------------------------------------- Backend
  postgres:
    image: postgres:16-alpine
    container_name: trainer-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dds112}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env — запустите start.bat (Windows) или ./start.sh}
      POSTGRES_DB: ${POSTGRES_DB:-dds112}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dds112} -d ${POSTGRES_DB:-dds112}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Резервные копии БД (ТЗ: резервное копирование): pg_dump той же версии, что PostgreSQL,
  # раз в BACKUP_INTERVAL_HOURS в ./data/backups, хранится BACKUP_KEEP последних.
  # Восстановление: docker compose exec -T postgres pg_restore -U dds112 -d dds112 --clean < data/backups/<файл>.dump
  backup:
    image: postgres:16-alpine
    container_name: trainer-backup
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-dds112}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env — запустите start.bat (Windows) или ./start.sh}
      PGDATABASE: ${POSTGRES_DB:-dds112}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./data/backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          f=/backups/dds112_$$(date +%Y%m%d_%H%M%S).dump
          pg_dump -Fc -f "$$f" && echo "копия $$f"
          ls -1t /backups/*.dump 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
          sleep $$((BACKUP_INTERVAL_HOURS * 3600))
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./backend
    container_name: trainer-api
    environment:
      APP_ENV: ${APP_ENV:-local}
      # стартовые учётные записи (seed при первом запуске); пароли меняются потом в интерфейсе
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD не задан в .env — запустите start.bat (Windows) или ./start.sh}
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:?TEACHER_PASSWORD не задан в .env — запустите start.bat (Windows) или ./start.sh}
      STUDENT_PASSWORD: ${STUDENT_PASSWORD:?STUDENT_PASSWORD не задан в .env — запустите start.bat (Windows) или ./start.sh}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-dds112}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env — запустите start.bat (Windows) или ./start.sh}
      POSTGRES_DB: ${POSTGRES_DB:-dds112}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY не задан в .env — запустите start.bat (Windows) или ./start.sh}
      # ML-сервис команды; чего он не умеет (501) или не смог — считают правила backend
      ML_SERVICE_URL: http://ml:8000
      ML_USE_STUB: "false"
      ML_FALLBACK_TO_RULES: "true"
      ML_TIMEOUT_SECONDS: ${ML_TIMEOUT_SECONDS:-60}
      # Телефония: backend поднимает звонки, телефония присылает события на вебхук
      TELEPHONY_SERVICE_URL: http://virtual-caller:8092
      TELEPHONY_USE_STUB: "false"
      TELEPHONY_WEBHOOK_TOKEN: ${TELEPHONY_WEBHOOK_TOKEN:?TELEPHONY_WEBHOOK_TOKEN не задан в .env — запустите start.bat (Windows) или ./start.sh}
      # Браузер на стенде ходит через nginx (CORS не нужен); это — frontend с dev-сервера
      # на этом же ПК (Live Server :5500, другой FRONTEND_PORT)
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-8080}","http://localhost:5500","http://127.0.0.1:5500"]'
      # классификатор происшествий заказчика — seed загружает его в БД при установке
      CLASSIFIER_XLSX: /srv/classifier/Klassifikator.xlsx
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy   # seed при установке генерирует сценарии через ML
    ports:
      - "${API_PORT:-8000}:8000"   # /docs — документация API
    volumes:
      - backend-var:/srv/app/var
      - ./ml/data/raw:/srv/classifier:ro
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    restart: unless-stopped

  # ------------------------------------------------------------------------ ML
  ml:
    build: ./ml
    container_name: trainer-ml
    environment:
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b-instruct}
      # Реплики собеседников в звонках: rules (быстро, предсказуемо) | llm (через Ollama, при сбое — rules).
      # qwen3:4b-instruct — без рассуждений вслух: ~3 с на реплику на CPU после прогрева.
      DIALOGUE_ENGINE: ${DIALOGUE_ENGINE:-rules}
      DIALOGUE_LLM_MODEL: ${DIALOGUE_LLM_MODEL:-qwen3:4b-instruct}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-20}
    depends_on:
      ollama:
        condition: service_healthy
        required: false   # без профиля llm ML работает без LLM
    ports:
      - "${ML_PORT:-8100}:8000"   # /docs — документация ML API
    restart: unless-stopped

  # Локальная LLM (профиль llm): модель скачивается один раз в том ollama-models.
  ollama:
    image: ollama/ollama:latest
    container_name: trainer-ollama
    profiles: [llm]
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: trainer-ollama-init
    profiles: [llm]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${LLM_MODEL:-qwen3:4b-instruct}"]
    restart: "no"

volumes:
  pgdata:
  backend-var:
  ollama-models:
