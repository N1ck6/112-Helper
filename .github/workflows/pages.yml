name: Deploy frontend to Pages
on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # сайт лежит в /112-Helper/, а иконки заданы от корня (/assets/...) —
      # правим пути только в опубликованной копии, исходники не меняются
      - run: grep -rl "/assets/" frontend --include=*.html --include=*.js | xargs sed -i "s#/assets/#/${{ github.event.repository.name }}/assets/#g"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4