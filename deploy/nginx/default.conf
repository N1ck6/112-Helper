# nginx стенда: раздаёт frontend/ и на том же адресе проксирует остальные части комплекса.
#
#   http://<хост>:8080/                frontend (статика из ./frontend)
#   http://<хост>:8080/api/v1/...      Backend (api:8000): вход, пользователи, занятия, карточки, отчёты
#   http://<хост>:8080/api/health/...  проверка Backend (api:8000/health/live|ready)
#   http://<хост>:8080/telephony/...   API телефонии (virtual-caller:8092), события SSE /telephony/events
#   http://<хост>:8080/recordings/...  записи разговоров (audio-tools:8090)
#   http://<хост>:8080/ml/dialogue/... реплики собеседников для звонка «в браузере» (ml:8000/dialogue/)
#
# Один origin: нет CORS, нет смешанного контента, работает с других ПК по LAN.
# Адреса для браузера — APP_CONFIG во frontend/js/config.js.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # DNS Docker: имя сервиса перечитывается каждые 10 с. Без этого nginx держит IP,
    # полученный при старте, и после пересоздания контейнера (обновление api, ml…)
    # проксирует в пустоту до своего рестарта. Поэтому адреса — через переменные.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    set $ml http://ml:8000;
    set $telephony http://virtual-caller:8092;
    set $recordings http://audio-tools:8090;

    # После обновления frontend браузер не должен брать старые js/css из кэша:
    # новый dashboard.html со старым app.js ломает страницу. no-cache = проверка по ETag (304).
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/v1/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket мониторинга занятия: /api/v1/ws/lessons/{id}
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        client_max_body_size 50m;   # = MAX_UPLOAD_MB backend (материалы, импорт)
    }

    location /api/health/ {
        rewrite ^/api(/health/.*)$ $1 break;
        proxy_pass $api;
    }

    # Наружу из ML — только реплики собеседников и поиск по классификатору происшествий
    # (остальной ML API вызывает Backend внутри сети)
    location /ml/dialogue/ {
        rewrite ^/ml(/dialogue/.*)$ $1 break;
        proxy_pass $ml;
        proxy_read_timeout 60s;
    }

    location = /ml/incident-types {
        rewrite ^/ml(/incident-types)$ $1 break;
        proxy_pass $ml;
    }

    location /telephony/ {
        rewrite ^/telephony(/.*)$ $1 break;
        proxy_pass $telephony;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # SSE: события отдаются сразу, соединение живёт долго
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /recordings/ {
        rewrite ^/recordings(/.*)$ $1 break;
        proxy_pass $recordings;
        proxy_buffering off;
    }
}
