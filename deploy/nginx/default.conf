# nginx стенда: раздаёт frontend/ и на том же адресе проксирует телефонию.
#
#   http://<хост>:8080/                frontend (статика из ./frontend)
#   http://<хост>:8080/telephony/...   API телефонии (virtual-caller:8092), события SSE /telephony/events
#   http://<хост>:8080/recordings/...  записи разговоров (audio-tools:8090)
#
# Один origin: нет CORS, нет смешанного контента, работает с других ПК по LAN.
# Адрес API для браузера — APP_CONFIG.TELEPHONY_API_URL во frontend/js/config.js.

server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # После обновления frontend браузер не должен брать старые js/css из кэша:
    # новый dashboard.html со старым app.js ломает страницу. no-cache = проверка по ETag (304).
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /telephony/ {
        proxy_pass http://virtual-caller:8092/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # SSE: события отдаются сразу, соединение живёт долго
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /recordings/ {
        proxy_pass http://audio-tools:8090/;
        proxy_buffering off;
    }
}
