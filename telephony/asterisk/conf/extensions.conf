; Dialplan — "логика звонков": что делать, когда кто-то набрал номер.
; На этапе 1 звонить пока некому (аккаунтов нет), поэтому тут только
; заглушка [default], чтобы Asterisk стартовал без ошибок конфигурации.
; Реальный набор номеров появится в этапе 2.

[general]
static=yes
writeprotect=no

[default]
; пусто — оба тестовых аккаунта используют контекст [internal] ниже.

; ============================================================
; [internal] — dialplan для двух SIP-аккаунтов alice(1001)/bob(1002).
; ============================================================
[internal]
; include => позволяет alice/bob (context=internal) набирать номера,
; которые физически описаны в контексте [training] ниже — не дублируем
; exten-строки, просто "подключаем" один контекст к другому.
include => training

; --- Звонок между двумя живыми людьми (нужны 2 софтфона/2 устройства) ---
; alice набирает 1002 -> звонит bob'у, и наоборот.
exten => 1002,1,NoOp(Звонок alice -> bob)
 same => n,Dial(PJSIP/bob,30)   ; ждём ответа 30 секунд
 same => n,Hangup()

exten => 1001,1,NoOp(Звонок bob -> alice)
 same => n,Dial(PJSIP/alice,30)
 same => n,Hangup()

; --- Echo-тест: набрать 600 с ОДНОГО софтфона, без второго участника ---
; Echo() — встроенное приложение Asterisk, отправляет обратно звонящему
; всё, что он говорит (с небольшой задержкой). Позволяет проверить, что
; SIP-сигнализация И RTP (звук в обе стороны) реально работают, даже
; если под рукой только один софтфон. Это ключевая проверка этапа 2.
exten => 600,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Playback(demo-echotest)   ; голосовая подсказка "это эхо-тест"
 same => n,Echo()
 same => n,Hangup()

; --- Milliwatt-тест: набрать 601 — эталонный тон 1004 Гц ---
; Проверяет ОДНОСТОРОННЕЕ аудио (сервер -> звонящий), полезно отдельно
; диагностировать направление "от Asterisk к телефону", если Echo-тест
; не проходит — сразу понятно, в какую сторону смотреть проблему.
exten => 601,1,NoOp(Milliwatt tone test)
 same => n,Answer()
 same => n,Milliwatt()
 same => n,Hangup()

; ============================================================
; Этап 3 — учебный сценарий с виртуальным абонентом.
; Обучающийся (диспетчер) набирает 700 -> Asterisk отвечает и ПОЛНОСТЬЮ
; передаёт управление звонком внешнему AGI-сервису (virtual_caller),
; который "играет" за позвонившего: проигрывает реплики сценария,
; слушает ответ диспетчера, ведёт лог session_id/scenario_id/call_id.
;
; Почему AGI, а не ARI:
; ARI (REST+WebSocket) даёт больше гибкости (управление звонком снаружи
; в реальном времени), но требует HTTP-сервер в Asterisk (http.conf),
; WebSocket-клиент и асинхронную модель на стороне Python.
; AGI — синхронный, однонаправленный, ~50 строк своего кода без внешних
; библиотек, проще протестировать локально и заменить (принцип из
; инструкции п.5.5: "сначала простое решение"). Для MVP этого достаточно;
; ARI можно будет добавить позже, не трогая SIP-часть.
;
; agi://virtual-caller:4573/scenario_001
;                ^service-name из docker-compose  ^scenario_id (аргумент)
[training]
; Входящий учебный вызов: обучающийся сам набирает номер сценария.
; Номер -> SCENARIO_ID, дальше общий путь [training-run].
exten => 700,1,NoOp(Учебный сценарий 1: входящий)
 same => n,Answer()
 same => n,Set(SCENARIO_ID=scenario_001)
 same => n,Goto(training-run,s,1)

exten => 701,1,NoOp(Учебный сценарий 2: входящий)
 same => n,Answer()
 same => n,Set(SCENARIO_ID=scenario_002)
 same => n,Goto(training-run,s,1)

; ============================================================
; [training-run] — прогон сценария, общий для входящего (700/701) и
; исходящего вызова (API virtual-caller: POST /calls -> AMI Originate
; с Context=training-run, переменные SCENARIO_ID и SESSION_ID).
;
; Запись: MixMonitor пишет ОБА направления разговора в один WAV.
; Стоит ДО AGI(), иначе реплики абонента не попадут в запись.
; Без опции "b": она пишет только пока канал в мосте (bridge), а здесь
; канал обслуживает AGI без моста — с "b" файл получался пустым (44 байта).
;
; Путь сначала кладётся в переменную через Set(): инлайн ${UNIQUEID} в
; аргументах MixMonitor на реальном тесте разворачивался в пустую строку.
; Имя файла = UNIQUEID = call_id (для исходящих его задаёт API через
; ChannelId в Originate).
; ============================================================
[training-run]
exten => s,1,NoOp(Сценарий ${SCENARIO_ID}, session ${SESSION_ID})
 same => n,Set(RECORD_FILE=/recordings/${UNIQUEID}.wav)
 same => n,MixMonitor(${RECORD_FILE})
 same => n,AGI(agi://virtual-caller:4573/${SCENARIO_ID})
 same => n,StopMixMonitor()
 same => n,Hangup()

; ============================================================
; [autotest] — имитация обучающегося для автотестов без человека.
; Originate на Local/operator@autotest: вторая половина Local-канала
; попадает сюда, "берёт трубку" и периодически "говорит" (Playback),
; первая половина идёт в [training-run] к виртуальному абоненту.
; Паузы — Playback(silence/N), а не Wait(): Wait не шлёт аудиокадров,
; и детектор тишины RECORD FILE их не видит (запись шла бы до таймаута).
; ============================================================
[autotest]
exten => operator,1,NoOp(Автотест: имитация диспетчера)
 same => n,Answer()
 same => n(talk),Playback(demo-thanks)
 same => n,Playback(silence/5)
 same => n,Goto(talk)
