; Dialplan — "логика звонков": что делать, когда кто-то набрал номер.
; На этапе 1 звонить пока некому (аккаунтов нет), поэтому тут только
; заглушка [default], чтобы Asterisk стартовал без ошибок конфигурации.
; Реальный набор номеров появится в этапе 2.

[general]
static=yes
writeprotect=no

[default]
; пусто — оба тестовых аккаунта используют контекст [internal] ниже.

; ============================================================
; [internal] — dialplan для двух SIP-аккаунтов alice(1001)/bob(1002).
; ============================================================
[internal]
; include => позволяет alice/bob (context=internal) набирать номера,
; которые физически описаны в контексте [training] ниже — не дублируем
; exten-строки, просто "подключаем" один контекст к другому.
include => training

; --- Звонок между двумя живыми людьми (нужны 2 софтфона/2 устройства) ---
; alice набирает 1002 -> звонит bob'у, и наоборот.
exten => 1002,1,NoOp(Звонок alice -> bob)
 same => n,Dial(PJSIP/bob,30)   ; ждём ответа 30 секунд
 same => n,Hangup()

exten => 1001,1,NoOp(Звонок bob -> alice)
 same => n,Dial(PJSIP/alice,30)
 same => n,Hangup()

; --- Echo-тест: набрать 600 с ОДНОГО софтфона, без второго участника ---
; Echo() — встроенное приложение Asterisk, отправляет обратно звонящему
; всё, что он говорит (с небольшой задержкой). Позволяет проверить, что
; SIP-сигнализация И RTP (звук в обе стороны) реально работают, даже
; если под рукой только один софтфон. Это ключевая проверка этапа 2.
exten => 600,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Playback(demo-echotest)   ; голосовая подсказка "это эхо-тест"
 same => n,Echo()
 same => n,Hangup()

; --- Milliwatt-тест: набрать 601 — эталонный тон 1004 Гц ---
; Проверяет ОДНОСТОРОННЕЕ аудио (сервер -> звонящий), полезно отдельно
; диагностировать направление "от Asterisk к телефону", если Echo-тест
; не проходит — сразу понятно, в какую сторону смотреть проблему.
exten => 601,1,NoOp(Milliwatt tone test)
 same => n,Answer()
 same => n,Milliwatt()
 same => n,Hangup()

; ============================================================
; Этап 3 — учебный сценарий с виртуальным абонентом.
; Обучающийся (диспетчер) набирает 700 -> Asterisk отвечает и ПОЛНОСТЬЮ
; передаёт управление звонком внешнему AGI-сервису (virtual_caller),
; который "играет" за позвонившего: проигрывает реплики сценария,
; слушает ответ диспетчера, ведёт лог session_id/scenario_id/call_id.
;
; Почему AGI, а не ARI:
; ARI (REST+WebSocket) даёт больше гибкости (управление звонком снаружи
; в реальном времени), но требует HTTP-сервер в Asterisk (http.conf),
; WebSocket-клиент и асинхронную модель на стороне Python.
; AGI — синхронный, однонаправленный, ~50 строк своего кода без внешних
; библиотек, проще протестировать локально и заменить (принцип из
; инструкции п.5.5: "сначала простое решение"). Для MVP этого достаточно;
; ARI можно будет добавить позже, не трогая SIP-часть.
;
; agi://virtual-caller:4573/scenario_001
;                ^service-name из docker-compose  ^scenario_id (аргумент)
[training]
; ------------------------------------------------------------
; Номера, которые обучающийся набирает сам (софтфон / IP-телефон).
; Всё сводится к переменным CALL_TYPE / CONTACT_ID / SCENARIO_ID
; и общему пути [training-run]; кто ответит — решает virtual-caller.
; ------------------------------------------------------------

; Входящий вызов 112 (режим оператора 112): голосовой заявитель по сценарию.
exten => 700,1,NoOp(Учебный сценарий 1: входящий)
 same => n,Answer()
 same => n,Set(SCENARIO_ID=scenario_001)
 same => n,Set(CALL_TYPE=incident_112)
 same => n,Goto(training-run,s,1)

exten => 701,1,NoOp(Учебный сценарий 2: входящий)
 same => n,Answer()
 same => n,Set(SCENARIO_ID=scenario_002)
 same => n,Set(CALL_TYPE=incident_112)
 same => n,Goto(training-run,s,1)

; Диспетчер ДДС звонит в службу: 2XXX — номер из справочника
; (telephony/virtual_caller/directory.json). Гудки, затем ответ собеседника.
; Неизвестный номер — «номер не обслуживается» (решает virtual-caller).
exten => _2XXX,1,NoOp(ДДС -> служба ${EXTEN})
 same => n,Set(CALL_TYPE=dispatch)
 same => n,Set(CONTACT_ID=${EXTEN})
 same => n,Gosub(ringback,s,1)
 same => n,Answer()
 same => n,Goto(training-run,s,1)

; Диспетчер ДДС перезванивает заявителю карточки, открытой на рабочем месте
; (PUT /trainees/{trainee}/context).
exten => 3000,1,NoOp(ДДС -> заявитель текущей карточки)
 same => n,Set(CALL_TYPE=applicant)
 same => n,Gosub(ringback,s,1)
 same => n,Answer()
 same => n,Goto(training-run,s,1)

; Любой другой номер — «Набранный номер не обслуживается» голосом
; (virtual-caller: служба не найдена в справочнике). Точные номера и _2XXX важнее шаблона.
exten => _X.,1,NoOp(Неизвестный номер ${EXTEN})
 same => n,Set(CALL_TYPE=dispatch)
 same => n,Set(CONTACT_ID=${EXTEN})
 same => n,Answer()
 same => n,Goto(training-run,s,1)

; Гудки «дозвона» 3 с. Набор с трубки: канал ещё не отвечен — Ringing() (гудки
; играет сам телефон). Набор с панели в АРМ (API, Originate): трубка уже снята —
; гудки играет Asterisk.
[ringback]
exten => s,1,ExecIf($["${CHANNEL(state)}" = "Up"]?Playtones(ring):Ringing())
 same => n,Wait(3)
 same => n,StopPlaytones()
 same => n,Return()

; ============================================================
; [training-run] — общий путь всех учебных звонков: набранных с телефона
; и исходящих из API (POST /calls -> AMI Originate с Context=training-run
; и переменными CALL_TYPE, CONTACT_ID, SESSION_ID, SCENARIO_ID).
;
; Запись: MixMonitor пишет ОБА направления в один WAV, до AGI().
; Без опции "b": она пишет только в мосте, а канал обслуживает AGI без
; моста — с "b" файл был пустым (44 байта).
; Путь — через Set(): инлайн ${UNIQUEID} в аргументах MixMonitor на
; реальном тесте разворачивался в пустую строку. UNIQUEID = call_id
; (для исходящих его задаёт API через ChannelId в Originate).
;
; RINGBACK_SEC (из API для звонка кнопкой в UI): обучающийся уже взял
; трубку своего телефона и слышит гудки, пока «дозванивается» до службы.
; ============================================================
[training-run]
exten => s,1,NoOp(${CALL_TYPE} сценарий=${SCENARIO_ID} session=${SESSION_ID})
 same => n,Set(RECORD_FILE=/recordings/${UNIQUEID}.wav)
 same => n,MixMonitor(${RECORD_FILE})
 same => n,GotoIf($["${RINGBACK_SEC}" = ""]?run)
 same => n,Playtones(ring)
 same => n,Wait(${RINGBACK_SEC})
 same => n,StopPlaytones()
 same => n(run),AGI(agi://virtual-caller:4573/${SCENARIO_ID})
 same => n,StopMixMonitor()
 same => n,Hangup()

; ============================================================
; [autotest] — имитация обучающегося для автотестов и демо без человека.
; Local/<exten>@autotest: вторая половина Local-канала попадает сюда,
; "берёт трубку" и говорит в звонок, первая — идёт к собеседнику.
;   operator — английская фраза из звуков Asterisk (проверка тракта);
;   9XXX     — русская фраза диспетчера /tts/operator_9XXX.wav, заранее
;              синтезированная голосом Irina (demo/demo_calls.py готовит файлы).
; Паузы — Playback(silence/N), а не Wait(): Wait не шлёт аудиокадров,
; и детектор тишины RECORD FILE их не видит.
; ============================================================
[autotest]
exten => operator,1,NoOp(Автотест: имитация диспетчера)
 same => n,Answer()
 same => n(talk),Playback(demo-thanks)
 same => n,Playback(silence/5)
 same => n,Goto(talk)

; LEAD — сколько секунд молчать до первой фразы: собеседник сначала говорит
; сам (гудки 3 с + «слушаю» ~3 с; доклад старшего ~11 с; «Алло?» ~1 с;
; заявитель 112 без гудков ~3 с).
exten => _9XXX,1,NoOp(Автотест: фраза диспетчера operator_${EXTEN})
 same => n,Answer()
 same => n,Set(LEAD=${IF($["${EXTEN}" = "9002"]?11:${IF($["${EXTEN}" = "9003"]?4:${IF($["${EXTEN}" = "9005"]?4:6)})})})
 same => n,Set(i=0)
 same => n(lead),Playback(silence/1)
 same => n,Set(i=$[${i} + 1])
 same => n,GotoIf($[${i} < ${LEAD}]?lead)
 same => n(talk),Playback(/tts/operator_${EXTEN})
 same => n,Playback(silence/12)
 same => n,Goto(talk)
