; AMI (Asterisk Manager Interface) — простой текстовый TCP-протокол
; для управления и мониторинга Asterisk снаружи, без SIP-клиента.
;
; Зачем он в MVP этапа 1, хотя в ТЗ явно не назван:
; пункт "health checks, технические логи и базовый мониторинг" нужно
; на чём-то реализовать программно. AMI — стандартный способ:
; pytest-тесты (см. tests/test_stage1_sip_server.py) логинятся и шлют
; действие "Ping", это и есть автоматическая проверка живости сервера
; поверх healthcheck.sh (который проверяет только сам процесс).
;
; Пароль НЕ хардкодим — подставляется из .env через переменную
; окружения при рендере конфига (см. docker-compose.yml, command
; entrypoint). Для простоты MVP пароль читается из ENV на старте
; контейнера entrypoint-скриптом (см. docker-compose.yml command).
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0

[test-user]
secret = ${AMI_PASSWORD}
read = system,call,log,verbose
write = system,call,log,verbose,originate
