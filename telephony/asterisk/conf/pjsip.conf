; PJSIP — современный SIP-стек Asterisk (заменил устаревший chan_sip).
; На этапе 1 нам не нужны учётные записи (SIP-аккаунты) — только
; поднять транспорт (порт, на котором Asterisk слушает SIP), чтобы
; можно было проверить, что сервер вообще откликается на SIP-уровне
; (например, командой `sipsak` или `nc -u` увидеть, что порт открыт).
; Аккаунты добавляются в этапе 2.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; ВАЖНО (добавлено после реального теста): даже для чисто локального
; стенда без выхода в интернет Docker сам по себе создаёт NAT-границу
; между контейнером и хостом. Без этих двух строк PJSIP кладёт в SDP
; (описание, куда слать голос) ВНУТРЕННИЙ IP контейнера в docker-сети
; (например 172.17.0.2) — софтфон снаружи не может отправить туда RTP,
; поэтому: сигнализация/дозвон работает, а звука нет, и многие софтфоны
; сами сбрасывают звонок, не получив медиа в течение нескольких секунд.
;
; EXTERNAL_MEDIA_ADDRESS задаётся в .env — это адрес, по которому ВАШ
; софтфон видит хост-машину с Docker:
;   - софтфон на той же машине, что и Docker  -> 127.0.0.1
;   - софтфон на другом устройстве в той же сети -> LAN-IP хост-машины
;     (Linux: `hostname -I`, macOS/Windows: обычный IP из настроек сети)
external_media_address = ${EXTERNAL_MEDIA_ADDRESS}
external_signaling_address = ${EXTERNAL_MEDIA_ADDRESS}
; ВАЖНО (фикс обрыва звонка ровно на ~32-й секунде):
; внутри контейнера SIP слушает 5060, а на хост проброшен ДРУГОЙ порт
; (см. ports в docker-compose.yml). Без external_signaling_port PJSIP пишет
; в Contact/Via порт bind'а (5060) -> софтфон шлёт ACK на 127.0.0.1:5060,
; ACK до этого Asterisk не доходит, Asterisk переотправляет 200 OK и через
; 64*T1 = 32 с (SIP Timer H/B, RFC 3261) рвёт вызов. Порт здесь обязан
; совпадать с портом хоста из ports.
external_signaling_port = ${EXTERNAL_SIGNALING_PORT}

; ============================================================
; Учётные записи (SIP-аккаунты) для двух софтфонов: alice/bob.
; Каждый аккаунт в PJSIP описывается ТРЕМЯ секциями:
;   endpoint — что аккаунту разрешено (кодеки, контекст dialplan'а);
;   auth     — логин/пароль для регистрации;
;   aor      — Address of Record, куда слать входящие вызовы
;              (адрес заполняется автоматически при REGISTER).
; Это стандартное разделение PJSIP, оно избыточно выглядит для двух
; тестовых пользователей, но именно так работает реальная регистрация
; софтфона/IP-телефона — учимся сразу на правильной модели.
; ============================================================

[alice]
type = endpoint
context = internal            ; какой контекст dialplan применяется к её звонкам
disallow = all
allow = ulaw,alaw              ; базовые кодеки, есть почти везде (в т.ч. в браузерных софтфонах)
auth = alice-auth
aors = alice
direct_media = no              ; звук всегда идёт через Asterisk, не напрямую между телефонами
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
media_use_received_transport = yes

[alice-auth]
type = auth
auth_type = userpass
username = alice
password = ${SIP_ALICE_PASSWORD}

; ВАЖНО: секция AOR должна называться ТОЧНО как username, который
; клиент шлёт в заголовке To: при REGISTER (это задокументированное
; поведение res_pjsip_registrar, а не опечатка) — поэтому [alice],
; а не [alice-aor]. Имя auth-секции при этом может быть любым, оно
; не участвует в этом матчинге.
[alice]
type = aor
max_contacts = 1
remove_existing = yes

[bob]
type = endpoint
context = internal
disallow = all
allow = ulaw,alaw
auth = bob-auth
aors = bob
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
media_use_received_transport = yes

[bob-auth]
type = auth
auth_type = userpass
username = bob
password = ${SIP_BOB_PASSWORD}

[bob]
type = aor
max_contacts = 1
remove_existing = yes
