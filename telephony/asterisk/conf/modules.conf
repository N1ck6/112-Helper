; Автозагрузка всех модулей, которые стоят в пакете.
; Для MVP это проще и надёжнее, чем вручную перечислять каждый нужный
; модуль (res_pjsip, chan_pjsip, app_mixmonitor, res_agi и т.д.) —
; на этапе 1-4 набор модулей ещё будет расти, вручную поддерживать
; список долго и легко что-то забыть.
;
; Когда MVP стабилизируется (этап 8-9), эту секцию стоит заменить на
; noload по умолчанию + явный load для нужных модулей — так контейнер
; стартует быстрее и меньше поверхность для багов.
[modules]
autoload=yes
