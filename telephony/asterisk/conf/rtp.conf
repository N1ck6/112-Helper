; RTP — это протокол, которым реально передаётся голос (SIP только
; договаривается "о встрече", сам звук идёт отдельными UDP-пакетами
; по портам из этого диапазона).
;
; Диапазон намеренно маленький (11 портов = хватает на несколько
; одновременных звонков для учебного стенда). Каждый занятый диапазон
; надо пробросить в docker-compose.yml (ports), иначе звук до контейнера
; не дойдёт при работе через NAT/hairpin на хосте.
[general]
; Отдельный от этапа 1 диапазон портов — чтобы stage1 и stage2 можно
; было при желании держать поднятыми одновременно (независимая
; проверка/исследование каждого этапа, см. корневой README).
rtpstart=10011
rtpend=10021
