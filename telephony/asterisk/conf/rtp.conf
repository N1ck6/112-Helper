; RTP — это протокол, которым реально передаётся голос (SIP только
; договаривается "о встрече", сам звук идёт отдельными UDP-пакетами
; по портам из этого диапазона).
;
; Один разговор с телефоном рабочего места занимает пару портов (RTP + RTCP):
; 60 портов = до 30 одновременных звонков (ТЗ: не меньше 20 сессий).
; Диапазон обязан совпадать с пробросом в docker-compose.yml (ports),
; иначе звук до контейнера не дойдёт.
[general]
rtpstart=10000
rtpend=10059
