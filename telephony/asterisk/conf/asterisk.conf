; Базовый конфиг Asterisk: где искать модули, звуки, куда писать логи и т.д.
; Меняем по минимуму — большинство путей стандартные для Debian-пакета.

[directories](!)
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
; Запускать не от root — отдельный системный пользователь asterisk
; создаётся пакетом при установке.
runuser = asterisk
rungroup = asterisk

; Не поднимаем полноценную консоль внутри контейнера — незачем,
; управляем только через `asterisk -rx "..."` (см. healthcheck.sh)
console = no
