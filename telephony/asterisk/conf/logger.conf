; Два канала логов:
;  1) console  — попадает в stdout процесса -> видно через `docker logs`.
;     Это основной канал для быстрой диагностики при разработке.
;  2) messages — обычный файл /var/log/asterisk/messages, живёт в volume
;     `asterisk-logs`, переживает пересоздание контейнера.
;
; full.log сознательно не включаем в MVP — на -vvv он быстро растёт
; и не нужен, пока нет прод-требований к аудиту (см. п.6 инструкции:
; "не усложнять MVP production-функциями").

[general]
; ротация раз в день, храним 7 дней — достаточно для учебного стенда
rotatestrategy = rotate

[logfiles]
console => notice,warning,error,verbose
messages => notice,warning,error
