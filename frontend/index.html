<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход · АРМ ДДС</title>
  <script>
    (function () {
      var saved = localStorage.getItem("ddsTheme");
      var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="login-page">

    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Переключить тему">
      <span class="icon" style="width:16px; height:16px;"></span>
    </button>

    <div class="login-card">

      <div class="login-brand">
        <span class="login-brand-icon">
          <span class="icon" style="--icon-src:url('/assets/icons/misc_phone.png'); width:18px; height:18px;"></span>
        </span>
        <div>
          <h1>АРМ ДДС</h1>
          <span>Система‑112 · учебный контур</span>
        </div>
      </div>

      <div class="role-switch" role="tablist" aria-label="Роль пользователя" id="role-switch">
        <span class="role-switch-indicator" id="role-indicator"></span>
        <button type="button" class="role-btn active" data-role="student" role="tab" aria-selected="true">Оператор</button>
        <button type="button" class="role-btn" data-role="teacher" role="tab" aria-selected="false">Диспетчер</button>
        <button type="button" class="role-btn" data-role="admin" role="tab" aria-selected="false">Администратор</button>
      </div>

      <form id="login-form" novalidate>
        <label>
          Логин
          <input type="text" name="username" autocomplete="username" required />
        </label>
        <label>
          Пароль
          <input type="password" name="password" autocomplete="current-password" required />
        </label>

        <p class="form-error" id="form-error" hidden>Введите логин и пароль</p>

        <button type="submit" class="btn-primary" id="login-submit" style="width:100%; padding:11px;">Войти</button>
      </form>

      <p class="login-footnote">ЛОКАЛЬНЫЙ КОНТУР · БЕЗ ДОСТУПА К ВНЕШНИМ СЕТЯМ</p>

    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
