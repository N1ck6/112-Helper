# Локальный контур разработки backend: PostgreSQL + API.
# ML-сервис, SIP/VoIP и frontend подключаются к этой же сети dds112 отдельными compose-файлами
# (зона ответственности участников 3 и 4) — см. раздел "Интеграции" в README.
name: dds112-trainer

services:
  postgres:
    image: postgres:16-alpine
    container_name: dds112-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dds112}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dds112}
      POSTGRES_DB: ${POSTGRES_DB:-dds112}
    ports:
      # Порт на стороне компьютера настраивается: если на машине уже работает
      # свой PostgreSQL на 5432, контейнер поднимается на другом порту
      # (POSTGRES_HOST_PORT=5433 в .env), и они не мешают друг другу.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dds112} -d ${POSTGRES_DB:-dds112}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [dds112]

  api:
    build: .
    container_name: dds112-api
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      #: Внутри сети контейнеров база всегда на 5432, какой бы порт ни был
      #: опубликован наружу. Без явного значения сюда попал бы POSTGRES_PORT
      #: из .env, рассчитанный на подключение с компьютера.
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./var:/srv/app/var
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks: [dds112]

volumes:
  pgdata:

networks:
  dds112:
    driver: bridge
    # internal: true  # включить в учебном контуре: полная изоляция от внешних сетей (п.6 ТЗ)
